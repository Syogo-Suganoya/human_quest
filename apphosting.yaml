# Firebase App Hosting の設定
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # ハッカソン/デモ用途のため最小構成（コスト抑制）
  maxInstances: 1

env:
  # Neon の接続文字列。値は Secret Manager に保存する（DEPLOY.md 参照）
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  # 投稿メディア（写真・動画）の保存先バケット名。未設定時はローカルディスクにフォールバックするため、
  # 本番では必須（DEPLOY.md 参照）
  - variable: FIREBASE_STORAGE_BUCKET
    value: human-quest-14a3f.firebasestorage.app
    availability:
      - RUNTIME

  # GEMINI_API_KEY は未設定。lib/ai.ts がルールベースにフォールバックするため動作に支障はない。
  # AIフィードバック・AI課題選定を有効にする場合は、以下でシークレットを登録（権限付与も同時に行われる）してから
  # 下のブロックのコメントを外す。
  #   firebase apphosting:secrets:set GEMINI_API_KEY --project human-quest-14a3f
  #
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  #   availability:
  #     - RUNTIME
