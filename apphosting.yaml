# Firebase App Hosting の設定
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # ハッカソン/デモ用途のため最小構成（コスト抑制）
  maxInstances: 1

env:
  # Neon の接続文字列。値は Secret Manager に保存する（DEPLOY.md 参照）
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  # 投稿メディア（写真・動画）の保存先バケット名。未設定時はローカルディスクにフォールバックするため、
  # 本番では必須（DEPLOY.md 参照）
  - variable: FIREBASE_STORAGE_BUCKET
    value: your-project-id.firebasestorage.app
    availability:
      - RUNTIME

  # 任意。Google AI Studio で発行したキー（未設定時はルールベースにフォールバック）
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
