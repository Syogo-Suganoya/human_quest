# Firebase App Hosting の設定
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # ハッカソン/デモ用途のため最小構成（コスト抑制）
  maxInstances: 1

env:
  # Neon の接続文字列。値は Secret Manager の DATABASE_URL に保存する。
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  # 投稿メディア（写真・動画）の保存先バケット名。
  # 未設定だとローカルディスクにフォールバックしてしまうため本番では必須。
  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
    availability:
      - RUNTIME

  # AIフィードバック・AI課題選定に使う Gemini のAPIキー。
  # 未設定・API失敗時は lib/ai.ts がルールベースの固定文言にフォールバックする。
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # 使用するモデル。秘匿値ではないのでここで管理する。
  # gemini-2.5-flash は新規ユーザーには提供されておらず 404 になる。
  - variable: AI_MODEL
    value: gemini-3.5-flash
    availability:
      - RUNTIME
